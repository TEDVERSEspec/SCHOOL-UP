<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SchoolUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%231D9BF0%27/%3E%3Cpath d=%27M32 14L12 26v4h40v-4zM18 33h6v12h-6zM29 33h6v12h-6zM40 33h6v12h-6zM12 48h40v5H12z%27 fill=%27white%27/%3E%3C/svg%3E">
<title>SchoolUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Pure black, hairline dividers, flat feed, one electric blue, chunky type. Layout: glass sidebar on desktop, floating glass dock on phones; content in a single readable column over a soft blue field. */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --bg:#000000; --surface:#0B0D10; --surface-2:#16181C;
  --ink:#E7E9EA; --ink-2:#8B98A5; --line:#2F3336;
  --navy:#EFF3F4; --blue:#1D9BF0; --blue-soft:#0A2338; --on-blue:#FFFFFF;
  --hero-a:#0A3A66; --hero-b:#1478C4;
  --good:#00D08A; --good-soft:#052A1F; --warn:#FFB020; --warn-soft:#2E2108; --bad:#FF6B72; --bad-soft:#3A0F12;
  --glass:rgba(22,24,28,.62); --glass-line:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.20);
  --glass-shadow:0 12px 36px rgba(0,0,0,.70); --ind:rgba(29,155,240,.22); --ind-edge:rgba(29,155,240,.50);
  --blob-a:#1D9BF0; --blob-b:#0A3A66; --blob-c:#1D9BF0; --blob-o:0;
  --chip-s:85%; --chip-bg-l:18%; --chip-fg-l:80%;
  --shadow:none;
  --bub-me:#0A84FF; --bub-them:#26262B; --glow:rgba(29,155,240,.16);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o)}
.bgfx i:nth-child(1){width:380px;height:380px;background:var(--blob-a);top:-120px;right:-80px}
.bgfx i:nth-child(2){width:320px;height:320px;background:var(--blob-b);top:42%;left:-120px}
.bgfx i:nth-child(3){width:340px;height:340px;background:var(--blob-c);bottom:-140px;right:12%}

.app{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow),inset 0 1.5px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-line)}
.side{display:none}
.main-wrap{min-width:0;display:flex;flex-direction:column;gap:14px;padding-bottom:112px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--hero-b),var(--hero-a));display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font:700 16px/1.1 var(--font-display)}
.brand span{font-size:11.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.top .who{margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

.dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:430px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:6px;z-index:20}
.dock-in{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.dock-ind{position:absolute;top:0;bottom:0;left:0;width:calc(100% / var(--n));transform:translateX(calc(var(--i) * 100%));border-radius:999px;
  background:var(--ind);border:1px solid var(--ind-edge);box-shadow:inset 0 1px 0 var(--glass-hi);transition:transform .38s cubic-bezier(.3,1.35,.5,1),opacity .2s}
.dock button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;font-weight:600;color:var(--ink-2);border-radius:999px;min-width:0}
.dock button svg{width:22px;height:22px}
.dock button.on{color:var(--blue)}
.dock button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:16px;background:var(--blue-soft);border:1px dashed var(--blue);font-size:13px}
.demo-bar .tag{background:var(--blue);color:var(--on-blue);font-weight:700;font-size:11px;letter-spacing:.08em;padding:2px 8px;border-radius:999px}
.demo-bar p{flex:1 1 220px;min-width:0;color:var(--ink)}
.demo-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--navy);color:#fff}

main{display:flex;flex-direction:column;gap:16px;min-width:0}
.page-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between}
.page-h h1{font-size:26px}
.page-h p{color:var(--ink-2);font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h2{font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.hero{border-radius:22px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero h1{font-size:26px}
.hero p{color:rgba(255,255,255,.82)}
.hero .next{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.hero .next small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.hero .next b{display:block;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.stat{padding:14px}
.stat b{display:block;font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)} .stat.good b{color:var(--good)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:hsl(var(--h,220) var(--chip-s) var(--chip-bg-l));color:hsl(var(--h,220) 60% var(--chip-fg-l))}
.chip.gen{--h:215}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill svg{width:13px;height:13px}
.p-ok{background:var(--blue-soft);color:var(--blue)} .p-soon{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-done{background:var(--good-soft);color:var(--good)}
.badge-new{background:var(--blue);color:var(--on-blue);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}

.list{display:flex;flex-direction:column;gap:10px}
.post{display:flex;flex-direction:column;gap:9px}
.post-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.type{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.type svg{width:16px;height:16px;color:var(--blue)}
.post h3{font-size:17px}
.post .body{color:var(--ink-2);font-size:14.5px;max-width:68ch}
.post-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.post-foot .grow{flex:1}
.attach{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.attach .fi{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.attach .fi svg{width:18px;height:18px}
.attach b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach small{color:var(--ink-2)}
.attach div{min-width:0;flex:1}
.post.done h3{text-decoration:line-through;text-decoration-color:var(--ink-2);opacity:.7}
.group-h{display:flex;align-items:center;gap:8px;font:700 13px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.group-h .n{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:0 8px;font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--navy);color:#fff;min-height:42px}
.btn svg{width:17px;height:17px}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.done-on{background:var(--good-soft);color:var(--good)}

.form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>span.l{font-weight:700;font-size:13px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=datetime-local],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:44px}
.field textarea{resize:vertical;min-height:110px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{position:relative}
.check input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%;margin:0}
.check span{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13px}
.check input:checked+span{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.check input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.errs{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;font-size:13.5px}
.note{font-size:13px;color:var(--ink-2)}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font:700 17px var(--font-display);margin-bottom:4px}
.bar{height:7px;border-radius:99px;background:var(--blue-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mini{font-size:13px;color:var(--ink-2)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:480px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tbl select{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 8px}

.daychips{margin-bottom:2px}
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.day{display:none}.day.active{display:block}
.day h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.slot time{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.slot .t{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.slot .t small{color:var(--ink-2);font-size:12px}
.slot.brk .t{color:var(--ink-2);font-style:italic;font-size:13px}
.change{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn)}
.change svg{width:20px;height:20px;flex:none;margin-top:1px}
.change b{display:block;color:var(--ink)} .change p{color:var(--ink);font-size:13.5px}

.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;display:grid;place-items:center;font-size:13px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}

.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.70);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.modal{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.preview{border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);min-height:150px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--ink-2);overflow:hidden}
.preview img{max-width:100%;max-height:300px;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--glass-shadow)}
.paused{text-align:center;padding:36px 18px}
.paused svg{width:42px;height:42px;color:var(--warn)}

@media (min-width:900px){
  .app{grid-template-columns:268px minmax(0,1fr);gap:28px;padding-block:20px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:20px;height:calc(100dvh - 40px);border-radius:28px;padding:18px 14px}
  .side .brandrow{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;border:1px solid transparent;background:none;padding:11px 14px;border-radius:16px;font-weight:600;color:var(--ink-2);text-align:left}
  .side nav button svg{width:20px;height:20px}
  .side nav button:hover{background:var(--ind)}
  .side nav button.on{background:var(--ind);border-color:var(--ind-edge);color:var(--blue);box-shadow:inset 0 1px 0 var(--glass-hi)}
  .side .usercard{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line)}
  .side .usercard b{display:block;font-size:14px;line-height:1.2} .side .usercard small{color:var(--ink-2)}
  .top{display:none}
  .dock{display:none}
  .main-wrap{padding-bottom:24px}
  .toast{bottom:28px}
  .modal-bg{align-items:center}.modal{border-radius:24px;padding-bottom:18px}
}
@media (min-width:1180px){
  .days{grid-template-columns:repeat(5,minmax(0,1fr))}
  .day{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
  .day.today{border-color:var(--blue)}
  .daychips{display:none}
  .slot{grid-template-columns:minmax(0,1fr)}
}

/* gate: splash, tour, login */
.gate{position:fixed;inset:0;z-index:100;overflow:auto;display:flex;flex-direction:column;
  background:radial-gradient(90% 55% at 50% 0%,var(--glow),transparent 70%),var(--bg);
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.splash{align-items:center;justify-content:center;text-align:center}
.splash .mark{position:relative;width:88px;height:88px;display:grid;place-items:center}
.splash .mark::before{content:"";position:absolute;inset:-46px;border-radius:50%;background:radial-gradient(circle,rgba(29,155,240,.38),transparent 65%);animation:pulse 2.4s ease-in-out infinite}
.logo-big{position:relative;width:88px;height:88px;border-radius:28px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--hero-b),var(--hero-a));box-shadow:0 14px 40px rgba(29,155,240,.40),inset 0 1px 0 rgba(255,255,255,.3)}
.logo-big svg{width:48px;height:48px}
.splash h1{font-size:32px;margin-top:26px}
.splash .sub{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.loadbar{width:150px;height:4px;border-radius:99px;background:var(--blue-soft);overflow:hidden;margin-top:28px}
.loadbar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#B5CCFF);transform-origin:left;animation:load 2s cubic-bezier(.4,0,.2,1) forwards}
.made{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.05em;color:var(--ink-2);opacity:.85}
.tour,.login{max-width:440px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.tour-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tour-card{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;min-height:360px}
.slide{display:flex;flex-direction:column;gap:14px;flex:1;animation:slidein .35s ease}
.slide .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--ind);border:1px solid var(--ind-edge);color:var(--blue)}
.slide .ic svg{width:28px;height:28px}
.slide h2{font-size:24px}
.slide p{color:var(--ink-2);max-width:46ch}
.tour-art{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-top:auto}
.tour-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px;align-items:center}
.dots span{height:8px;width:8px;border-radius:99px;background:var(--line);transition:width .25s,background .25s}
.dots span.on{width:24px;background:var(--blue)}
.numinput{font:700 24px var(--font-display)!important;letter-spacing:.14em;text-align:center}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gatein{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* X-style layer: black canvas, hairline dividers, flat feed, bold type, pill buttons */
body{font-size:16px}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
.page-h h1,.hero h1{font-size:32px}
.splash h1{font-size:38px;font-weight:800}
.sec-h h2{font-size:22px}
.post h3{font-size:19px}
.stat b{font-size:36px;font-weight:800}
.card{box-shadow:none;border-radius:20px;padding:18px}
.list:has(>.post){gap:0}
.post.card{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:20px 2px;gap:11px}
.post .body{font-size:16px;color:var(--ink)}
.hero{border-radius:24px;padding:24px}
.attach{border-radius:16px}
.btn{min-height:50px;padding:12px 24px;border-radius:999px;font-weight:800;font-size:16px;background:var(--ink);color:var(--bg)}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #536471}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.done-on{background:var(--good-soft);color:var(--good)}
.btn.sm{min-height:38px;padding:7px 16px;font-size:14px}
.seg{border-radius:999px;background:transparent}
.seg button{border-radius:999px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg)}
.fchip{padding:9px 18px;font-size:15px;font-weight:700;background:transparent}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip,.pill{font-weight:700}
.pill{padding:5px 12px;font-size:13px}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=datetime-local],.field select,.field textarea{background:var(--bg);min-height:52px;border-radius:14px;font-size:16px}
.field input[type=text]:focus,.field input[type=email]:focus,.field input[type=password]:focus,.field input[type=datetime-local]:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 1px var(--blue)}
.toast{background:var(--ink);color:var(--bg)}
.dock button{font-weight:700}
.dock button svg{width:25px;height:25px}
.side nav button{font-size:19px;font-weight:700;padding:13px 18px}
.side nav button svg{width:26px;height:26px}

/* draggable glass pill */
.dock{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.dock-in.drag .dock-ind{opacity:0;transition:none}
.dock button svg{transition:transform .25s cubic-bezier(.3,1.35,.5,1)}
.dock-in.drag button.on svg{transform:scale(1.3)}
.dock-in.drag button.on{color:#fff}
.lens{position:fixed;left:0;top:0;z-index:25;pointer-events:none;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 45%,rgba(255,255,255,.12));
  -webkit-backdrop-filter:saturate(1.9) brightness(1.22);backdrop-filter:saturate(1.9) brightness(1.22);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -3px 3px rgba(255,255,255,.28),inset 0 0 22px rgba(255,255,255,.14),0 16px 38px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);
  transition:opacity .2s}
.lens.anim{transition:transform .26s cubic-bezier(.3,1.3,.5,1),width .26s,height .26s,opacity .2s}

/* home, profile, compact demo bar */
.demo-bar{padding:8px 12px;gap:8px 10px}

.demo-tools{width:100%;padding-top:2px}
button.avatar{border:0;cursor:pointer;font:700 13px var(--font-body)}
.side .usercard{cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}

.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.glance button{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}

.periods{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.periods::-webkit-scrollbar{display:none}
.period{flex:none;width:138px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.period time{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:700}
.period .chip{white-space:normal}
.period small{color:var(--ink-2);font-size:12.5px}
.period.now{border-color:var(--blue);background:var(--blue-soft)}
.period.brk{background:transparent;border-style:dashed;color:var(--ink-2);justify-content:center}
.prof-head{display:flex;align-items:center;gap:16px}
.avatar.big{width:72px;height:72px;font-size:26px;font-weight:800}

.res .tot{font:800 22px var(--font-display);font-variant-numeric:tabular-nums}
.res .meta{color:var(--ink-2);font-size:13px}

.cc-mid{flex:1;min-width:0;display:flex;flex-direction:column}

.convo{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink)}
.cv-av{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--hero-b),var(--hero-a));display:grid;place-items:center;font:800 18px var(--font-display);color:#fff;flex:none}

.cv-prev{color:var(--ink-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.rules b{display:block}
.rules span{color:var(--ink-2);font-size:14px}
.thread-bg{position:fixed;left:0;right:0;top:0;bottom:0;z-index:40;display:flex;background:var(--bg)}
.thread{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.th-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:rgba(12,12,14,.86);border-bottom:1px solid var(--line)}

.stamp{text-align:center;font-size:11.5px;color:var(--ink-2);margin:14px 0 6px}
.sys{text-align:center;font-size:12px;color:var(--ink-2);margin:10px auto;max-width:34ch}
.mrow{display:flex;gap:8px;align-items:flex-end}

.tbadge{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:0 5px;font-weight:700;font-size:10.5px;margin-left:5px}
.bubble{display:block;text-align:left;font:inherit;font-size:16px;line-height:1.3;color:#fff;background:var(--bub-them);border:0;border-radius:19px;padding:8px 13px;overflow-wrap:anywhere;white-space:pre-wrap;max-width:100%}
.me .bubble{background:var(--bub-me)}
.them.tail .bubble{border-bottom-left-radius:6px}
.me.tail .bubble{border-bottom-right-radius:6px}

.plus{width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.plus svg{width:20px;height:20px}
.cwrap{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:22px;padding:3px 4px 3px 14px;background:var(--bg)}
.cwrap:focus-within{border-color:var(--bub-me)}
.cwrap input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;min-height:36px;color:var(--ink)}
.send{width:32px;height:32px;border-radius:50%;border:0;background:var(--bub-me);color:#fff;display:grid;place-items:center;flex:none;opacity:.35;padding:0;transition:opacity .15s}
.send.on{opacity:1}
.send svg{width:18px;height:18px}
.cbar{padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;color:var(--ink-2);background:var(--surface);border-top:1px solid var(--line)}

  .thread{flex:none;width:min(560px,100%);height:100%;max-height:820px;border:1px solid var(--line);border-radius:28px;overflow:hidden}
}

.logo{overflow:hidden}

.upw{font-style:normal;color:var(--blue)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function dl(p,done){
  if(done)return {c:'p-done',t:'Done',i:'check'};

  if(d<0){var ov=Math.ceil(-d/H);return {c:'p-bad',t:'Overdue '+(ov<24?ov+' h':Math.round(ov/24)+' d'),i:'clock'}}
  if(d<24*H)return {c:'p-soon',t:'Due in '+Math.max(1,Math.round(d/H))+' h',i:'clock'};
  if(d<48*H)return {c:'p-soon',t:'Due tomorrow '+fmtTime(p.deadline),i:'clock'};

  var active=S.ttDay!=null?S.ttDay:(today<5?today:0);

  var h=CL.on?'<p class="note">This is an automatic layout built from your school\'s subjects. It is not a custom school timetable yet.</p>':'';
  changes.forEach(function(p){h+='<div class="change">'+icon('cal')+'<div><b>'+esc(p.title)+'</b><p>'+esc(p.body)+'</p></div></div>'});
  h+='<div class="chips daychips">'+DAYFULL.map(function(d,i){return '<button class="fchip'+(i===active?' on':'')+'" data-act="ttday" data-v="'+i+'">'+d.slice(0,3)+(i===today?' · today':'')+'</button>'}).join('')+'</div>';
  h+='<div class="days">';
  tt.forEach(function(day,di){
    h+='<section class="day'+(di===active?' active':'')+(di===today?' today':'')+'"><h3>'+DAYFULL[di]+(di===today?'<span class="pill p-ok">Today</span>':'')+'</h3>';

    h+='</section>';
  });
  return h+'</div>';
}

function nowSlot(){
  var d=new Date(),m=d.getHours()*60+d.getMinutes();
  var mins=PERIODS.map(function(p){var q=p[0].split(':');return +q[0]*60+(+q[1])});
  for(var i=0;i<mins.length;i++){var en=i<mins.length-1?mins[i+1]:mins[i]+45;if(m>=mins[i]&&m<en)return i}
  return -1;
}
function vStuHome(){
  var st=curStudent();if(!st)return empty('No students','Ask an administrator to add a student.');
  if(st.status==='paused')return pausedView(st);
  var posts=postsFor(st.classId),ass=posts.filter(function(p){return p.type==='assignment'});
  var open=ass.filter(function(p){return !isDone(st.id,p.id)});
  var soon=open.filter(function(p){return p.deadline>=now()&&p.deadline-now()<48*H});
  var over=open.filter(function(p){return p.deadline<now()});
  var news=posts.filter(function(p){return isNew(st.id,p)});
  var urgent=open.filter(function(p){return p.deadline-now()<72*H}).sort(function(a,b){return a.deadline-b.deadline}).slice(0,4);
  if(['all','announcement','timetable','reminder','material'].indexOf(S.feed)<0)S.feed='all';
  var feed=posts.filter(function(p){return p.type!=='assignment'&&(S.feed==='all'||p.type===S.feed)});
  var need=soon.length+over.length;
  var h='<section class="hero"><p>'+esc(clsName(st.classId))+' · '+greet()+'</p><h1>Hi '+esc(st.name.split(' ')[0])+'</h1><p>'+(need?('You have '+plural(need,'assignment')+' that need'+(need===1?'s':'')+' your attention.'):'Nothing urgent right now. Nice one.')+'</p>'+
    '<div class="glance"><button data-nav="tasks"><b>'+soon.length+'</b><span>Due in 48 hours</span></button><button data-nav="tasks"><b>'+over.length+'</b><span>Overdue</span></button><button data-act="jumpfeed"><b>'+news.length+'</b><span>New updates</span></button></div></section>';
  var cst=DB.chat[st.classId]||[],cun=unreadChat(st),clast=lastMsg(st.classId);
  h+='<button class="card chatcard" data-nav="chat"><span class="cc-ic">'+icon('chat')+'</span><span class="cc-mid"><b>'+esc(clsName(st.classId))+' class chat</b><span class="mini">'+(cun?plural(cun,'new message'):'No new messages')+(clast?' · '+esc(chatPreview(clast)):'')+'</span></span>'+(cun?'<i class="nb static">'+(cun>9?'9+':cun)+'</i>':'')+'</button>';
  h+='<div class="sec-h"><div><h2>To do next</h2><p class="sec-sub">Tap the circle when you finish a task</p></div></div>';
  if(urgent.length){
    h+='<div class="list">'+urgent.map(function(p){
      var d=dl(p,false);
      return '<article class="card todo"><button class="tick" data-act="done" data-id="'+p.id+'" aria-label="Mark done: '+esc(p.title)+'">'+icon('check')+'</button><div class="mid"><h3>'+esc(p.title)+'</h3><div class="post-foot">'+subjChip(p.subject)+'<span class="pill '+d.c+'">'+icon(d.i)+esc(d.t)+'</span></div></div></article>';
    }).join('')+'</div>';
  }else h+=empty('You are all caught up','Nothing is due in the next 3 days.');
  h+='<div class="row"><button class="btn ghost sm" data-nav="tasks">All assignments ('+open.length+' to do)</button></div>';
  var di=(new Date().getDay()+6)%7,tt=timetable(st.classId);
  h+='<div class="sec-h"><div><h2>Today\'s classes</h2><p class="sec-sub">'+esc(new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))+'</p></div><button class="btn sm ghost" data-nav="timetable">Full timetable</button></div>';
  if(di>4||!tt.length)h+='<div class="card empty"><b>No classes today</b>Your timetable runs Monday to Friday.</div>';
  else{
    var cur=nowSlot();
    h+='<div class="periods">'+tt[di].map(function(sid,i){
      if(!sid)return '<div class="period brk"><time>'+PERIODS[i][0]+'</time><span>Short break</span></div>';
      var t=teacherFor(st.classId,sid);
      return '<div class="period'+(i===cur?' now':'')+'"><time>'+PERIODS[i][0]+(i===cur?' · now':'')+'</time>'+subjChip(sid)+(t?'<small>'+esc(t.name)+'</small>':'')+'</div>';
    }).join('')+'</div>';
  }
  h+='<div class="sec-h" id="updates"><div><h2>Updates from school</h2><p class="sec-sub">Announcements, reminders and notes for '+esc(clsName(st.classId))+'</p></div>'+(news.length?'<button class="btn sm ghost" data-act="readall">Mark all read</button>':'')+'</div>';
  h+=chipRow([['all','All'],['announcement','Announcements'],['timetable','Timetable'],['reminder','Reminders'],['material','Materials']],S.feed,'feed');
  h+=feed.length?'<div class="list">'+feed.map(function(p){return postCard(p,'student')}).join('')+'</div>':empty('Nothing here yet','Updates for '+clsName(st.classId)+' will appear here.');
  return h;
}
function vStuTasks(){
  var st=curStudent();if(!st)return empty('No students','');
  if(st.status==='paused')return pausedView(st);
  var ass=postsFor(st.classId).filter(function(p){return p.type==='assignment'});
  var list=ass.filter(function(p){var d=isDone(st.id,p.id);return S.taskStatus==='all'||(S.taskStatus==='done'?d:!d)});
  var h='<div class="page-h"><div><h1>Assignments</h1><p>'+plural(ass.filter(function(p){return !isDone(st.id,p.id)}).length,'task')+' still to do for '+esc(clsName(st.classId))+'</p></div></div>';
  h+='<div class="row"><div class="seg"><button class="'+(S.taskView==='deadline'?'on':'')+'" data-act="tview" data-v="deadline">By deadline</button><button class="'+(S.taskView==='subject'?'on':'')+'" data-act="tview" data-v="subject">By subject</button></div></div>';
  h+=chipRow([['all','All'],['todo','To do'],['done','Done']],S.taskStatus,'tstatus');
  if(!list.length)return h+empty('No assignments here','Try another filter.');
  var groups=[];
  if(S.taskView==='subject'){
    DB.subjects.forEach(function(s){
      var g=list.filter(function(p){return p.subject===s.id}).sort(function(a,b){return (isDone(st.id,a.id)-isDone(st.id,b.id))||a.deadline-b.deadline});
      if(g.length)groups.push([s.name,g]);
    });
  }else{
    var by=function(f){return list.filter(f).sort(function(a,b){return a.deadline-b.deadline})};
    var open=function(p){return !isDone(st.id,p.id)};
    groups=[['Overdue',by(function(p){return open(p)&&p.deadline<now()})],
      ['Today and tomorrow',by(function(p){return open(p)&&p.deadline>=now()&&p.deadline-now()<48*H})],
      ['This week',by(function(p){return open(p)&&p.deadline-now()>=48*H&&p.deadline-now()<7*D})],
      ['Later',by(function(p){return open(p)&&p.deadline-now()>=7*D})],
      ['Completed',by(function(p){return !open(p)})]].filter(function(g){return g[1].length});
  }
  groups.forEach(function(g){h+='<div class="group-h">'+esc(g[0])+'<span class="n">'+g[1].length+'</span></div><div class="list">'+g[1].map(function(p){return postCard(p,'student')}).join('')+'</div>'});
  return h;
}
function vStuMaterials(){
  var st=curStudent();if(!st)return empty('No students','');
  if(st.status==='paused')return pausedView(st);
  var all=postsFor(st.classId).filter(function(p){return p.file});
  var ids=[];all.forEach(function(p){if(ids.indexOf(p.subject)<0)ids.push(p.subject)});
  var items=[['all','All']].concat(ids.map(function(id){var s=subj(id);return [id,s?s.name:'General']}));
  if(items.map(function(i){return i[0]}).indexOf(S.matSubj)<0)S.matSubj='all';
  var list=all.filter(function(p){return S.matSubj==='all'||p.subject===S.matSubj});

  h+=chipRow(items,S.matSubj,'msubj');

}

function cloudInit(){
  var cfg=window.SCHOOLUP_CONFIG;
  if(!cfg||!cfg.url||!cfg.key||!window.supabase||!window.supabase.createClient)return false;
  try{CL.sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}catch(e){return false}

function normId(x){return String(x||'').replace(/\s+/g,'').toUpperCase()}

function idPw(id){return 'su-'+normId(id)}

function emailFor(code,no){

  return clean(no)+'.'+clean(code)+'@'+((CL.cfg&&CL.cfg.studentEmailDomain)||'students.schoolup.app');

function cerr(e){
  var m=(e&&e.message)||String(e||'');
  if(/Invalid login/i.test(m))return 'Those details do not match. Check the school code, number or email, and your password.';
  if(/rate limit|too many|over_request/i.test(m))return 'Too many attempts. Wait a minute and try again.';
  if(/already registered|already been registered/i.test(m))return 'That account already exists. Use Sign in instead.';
  if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))return 'No connection. Check your internet and try again.';
  if(/row-level security|permission denied/i.test(m))return 'You do not have permission to do that.';
  if(/duplicate key/i.test(m))return 'That already exists.';
  return m||'Something went wrong.';
}
function chk(r){if(r&&r.error)throw r.error;return r?r.data:null}
function sbq(p){return Promise.resolve(p).then(chk)}
function cw(p,what){Promise.resolve(p).then(chk).catch(function(e){toast((what||'Could not save')+'. '+cerr(e));cloudRefresh()})}

/* ---------- load ---------- */
function cloudLoad(uid){
  var sb=CL.sb,T=function(t){return sbq(sb.from(t).select('*'))};
  return sbq(sb.from('profiles').select('*').eq('id',uid).maybeSingle()).then(function(prof){
    if(!prof)return {none:true};
    var admin=prof.role==='admin';
    return Promise.all([
      sbq(sb.from('schools').select('*').eq('id',prof.school_id).single()),
      T('classes'),T('subjects'),T('profiles'),
      sbq(sb.from('posts').select('*').order('created_at',{ascending:false}).limit(500)),
      T('post_classes'),T('completions'),
      sbq(sb.from('messages').select('*').order('created_at',{ascending:false}).limit(500)),
      sbq(sb.from('message_reactions').select('*').limit(3000)),
      T('chat_settings'),
      admin?T('roster'):Promise.resolve([])
    ]).then(function(x){return {prof:prof,school:x[0],classes:x[1],subjects:x[2],profiles:x[3],posts:x[4],post_classes:x[5],completions:x[6],messages:x[7],reactions:x[8],chat_settings:x[9],roster:x[10]}});
  });

function mapMsg(m){
  return {id:m.id,from:m.sender_id,text:m.removed?'':m.body,at:Date.parse(m.created_at),
    imgPath:m.removed?null:m.img_path,img:m.removed||!m.img_path?null:(CL.imgCache[m.img_path]||null),
    removed:!!m.removed,by:m.removed?(m.removed_by===m.sender_id?'author':'teacher'):undefined,react:null};
}
function buildDB(r){
  var d=blankDB(),uid=r.prof.id;
  d.classes=r.classes.map(function(c){return {id:c.id,name:c.name,level:c.level}}).sort(function(a,b){return a.name<b.name?-1:1});
  d.subjects=r.subjects.map(function(s){return {id:s.id,name:s.name,h:s.hue}});
  d.admins={};
  r.profiles.forEach(function(p){
    if(p.role==='teacher')d.teachers.push({id:p.id,name:p.full_name,subjects:p.subject_ids||[],classes:p.class_ids||[]});
    else if(p.role==='student')d.students.push({id:p.id,name:p.full_name,classId:p.class_id||'',status:p.paused?'paused':'active',no:p.student_no});
    else d.admins[p.id]=p.full_name;
  });
  var claimedCode={};
  (r.roster||[]).forEach(function(x){
    if(x.claimed_by){claimedCode[x.claimed_by]=x.claim_code;return}
    if(x.role==='teacher')d.teachers.push({id:x.id,name:x.full_name,subjects:x.subject_ids||[],classes:x.class_ids||[],pending:true,code:x.claim_code});
    else d.students.push({id:x.id,name:x.full_name,classId:x.class_id||'',status:'active',no:x.student_no,pending:true,code:x.claim_code});
  });
  d.students.forEach(function(s){if(claimedCode[s.id])s.code=claimedCode[s.id]});
  var pc={};r.post_classes.forEach(function(x){(pc[x.post_id]=pc[x.post_id]||[]).push(x.class_id)});
  d.posts=r.posts.map(function(p){return {id:p.id,type:p.type,title:p.title,body:p.body,subject:p.subject_id||'',classes:pc[p.id]||[],authorId:p.author_id,createdAt:Date.parse(p.created_at),deadline:p.deadline?Date.parse(p.deadline):null,file:p.file||null}}).sort(function(a,b){return b.createdAt-a.createdAt});
  r.completions.forEach(function(c){(d.done[c.student_id]=d.done[c.student_id]||{})[c.post_id]=true});
  d.classes.forEach(function(c){d.chat[c.id]=[]});
  var byId={};
  r.messages.slice().reverse().forEach(function(m){var o=mapMsg(m);byId[m.id]=o;if(d.chat[m.class_id])d.chat[m.class_id].push(o)});
  r.reactions.forEach(function(x){var m=byId[x.message_id];if(!m||m.removed)return;m.react=m.react||{};(m.react[x.emoji]=m.react[x.emoji]||[]).push(x.user_id)});
  r.chat_settings.forEach(function(c){if(c.paused)d.chatPaused[c.class_id]=true});
  var cs=parseInt(lsGet('su_cs_'+uid),10);d.chatSeen[uid]=isNaN(cs)?now():cs;
  var seen={};try{(JSON.parse(lsGet('su_ps_'+uid)||'[]')).forEach(function(id){seen[id]=true})}catch(e){}
  d.seen[uid]=seen;
  return d;
}
function cloudApply(r){
  var prof=r.prof,sc=r.school;
  CL.rosterOf={};(r.roster||[]).forEach(function(x){if(x.claimed_by)CL.rosterOf[x.claimed_by]=x.id});
  DB=buildDB(r);T0=now();
  S.school={id:sc.id,code:sc.join_code,name:sc.name,city:sc.city||'',motto:sc.motto||'',logo:sc.logo_url||null,color:sc.color||'blue',demo:false,adminName:prof.role==='admin'?prof.full_name:'School office',paused:sc.paused};

function signImgs(){
  var need=[];
  Object.keys(DB.chat).forEach(function(c){DB.chat[c].forEach(function(m){if(m.imgPath&&!m.img&&need.indexOf(m.imgPath)<0)need.push(m.imgPath)})});

  CL.sb.storage.from(BUCKET).createSignedUrls(need,3600).then(function(r){
    if(r.error||!r.data)return;

}

/* ---------- enter / leave / refresh ---------- */
function cloudEnter(uid){
  S.stage='loading';render();
  return cloudLoad(uid).then(function(r){
    if(r.none){
      return CL.sb.auth.signOut().catch(function(){}).then(function(){S.authed=false;S.stage='login';S.loginErr='This account is not linked to a school. Check your details, or ask your school office.';render()});
    }
    cloudApply(r);S.authed=true;S.route=NAV[S.role][0][0];S.loginErr='';S.lf.pw='';
    S.stage=tourSeen()?'app':'tutorial';S.tourStep=0;
    cloudSubscribe();render();window.scrollTo(0,0);
  }).catch(function(e){S.authed=false;S.stage='login';S.loginErr=cerr(e);render()});
}
function cloudBoot(){
  var fall=function(){S.stage=tourSeen()?'login':'tutorial';S.tourStep=0;render()};
  CL.sb.auth.getSession().then(function(r){
    var ses=r.data&&r.data.session;
    if(ses)return cloudEnter(ses.user.id);
    fall();
  }).catch(fall);
}
function cloudLeave(){
  if(CL.ch){try{CL.sb.removeChannel(CL.ch)}catch(e){}CL.ch=null}
  DB=blankDB();S.authed=false;S.me=null;S.stage='login';S.loginErr='';S.lf={};S.modal=null;S.thread=null;S.draft=null;S.editId=null;S.confirmDel=null;
  S.school=platformSchool();applyTheme('blue');S.role='student';

}
function cloudLogout(){CL.sb.auth.signOut().catch(function(){}).then(function(){if(S.authed)cloudLeave()})}
var rfBusy=false,rfAgain=false;
function cloudRefresh(){
  if(!CL.on||!S.authed||!S.me)return;
  if(rfBusy){rfAgain=true;return}
  rfBusy=true;
  cloudLoad(S.me.id).then(function(r){
    rfBusy=false;
    if(!r.none&&S.authed){
      cloudApply(r);
      var a=document.activeElement,typing=a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName);
      if(S.stage==='app'){
        if(!typing&&S.route!=='compose'&&!S.modal)render();
        if(S.thread)fillThread(false);
      }
    }
    if(rfAgain){rfAgain=false;cloudRefresh()}
  }).catch(function(){rfBusy=false});
}
function rtKick(){clearTimeout(CL.rt);CL.rt=setTimeout(cloudRefresh,400)}
function onMsgChange(pl){
  if(pl.eventType==='INSERT'&&pl.new){
    var m=pl.new,list=DB.chat[m.class_id];
    if(!list)return;
    if(!list.some(function(x){return x.id===m.id})){
      list.push(mapMsg(m));list.sort(function(a,b){return a.at-b.at});signImgs();
      if(S.thread===m.class_id)fillThread(true);
      else if(S.stage==='app'){var a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()}
    }
    return;
  }
  rtKick();
}
function cloudSubscribe(){
  if(CL.ch){try{CL.sb.removeChannel(CL.ch)}catch(e){}CL.ch=null}
  try{
    var sid=S.school.id,f=function(t,filt){var o={event:'*',schema:'public',table:t};if(filt)o.filter='school_id=eq.'+sid;return o};
    CL.ch=CL.sb.channel('su-'+sid)
      .on('postgres_changes',f('messages',1),onMsgChange)
      .on('postgres_changes',f('posts',1),rtKick)
      .on('postgres_changes',f('chat_settings',1),rtKick)
      .on('postgres_changes',f('post_classes'),rtKick)
      .on('postgres_changes',f('message_reactions'),rtKick)
      .subscribe();
  }catch(e){}
}

/* ---------- sign-in, join, register ---------- */
function readLogin(){var f=document.getElementById('loginForm');if(!f)return;[].forEach.call(f.querySelectorAll('input[data-lf]'),function(i){S.lf[i.getAttribute('data-lf')]=i.value})}
function authUser(r){if(r.error)throw r.error;return r.data.user}
function signInOrUp(email,pw){
  var sb=CL.sb;
  return sb.auth.signInWithPassword({email:email,password:pw}).then(function(r){
    if(!r.error&&r.data&&r.data.user)return r.data.user;
    return sb.auth.signUp({email:email,password:pw}).then(function(s){
      if(s.error)throw s.error;
      if(!s.data||!s.data.session)throw new Error('Sign-up is waiting for email confirmation. The school must switch "Confirm email" off in Supabase (see README).');
      return s.data.user;
    });
  });
}
function cloudLogin(){
  readLogin();
  var v=S.lf,sb=CL.sb;
  if(S.loginAs==='student'){
    var sid=normId(v.sid);
    if(!sid){S.loginErr='Enter your Student ID.';renderGate();return}
    if(!/^[A-Z0-9]+-[A-Z0-9]+$/.test(sid)){S.loginErr='That does not look like a Student ID. It looks like 1001-9C3E5A7B21. Ask your school office.';renderGate();return}
    S.busy=true;S.loginErr='';renderGate();
    signInOrUp(idEmail(sid),idPw(sid)).then(function(user){
      return sbq(sb.rpc('claim_student',{p_student_id:sid})).then(function(){return user},function(e){
        return sb.auth.signOut().catch(function(){}).then(function(){throw e});
      });
    }).then(function(user){S.busy=false;return cloudEnter(user.id)}).catch(function(e){S.busy=false;S.stage='login';S.loginErr=cerr(e);renderGate()});
    return;
  }
  var code=(v.code||'').trim(),pw=v.pw||'',claim=(v.claim||'').trim(),email=(v.email||'').trim().toLowerCase(),join=S.loginMode==='join',msg='';
  if(!email)msg='Enter your email.';
  else if(join&&!code)msg='Enter your school code.';
  else if(join&&!claim)msg='Enter the claim code your school gave you.';
  else if(!pw)msg='Enter your password.';
  else if(join&&pw.length<8)msg='Choose a password of at least 8 characters.';
  if(msg){S.loginErr=msg;renderGate();return}
  S.busy=true;S.loginErr='';renderGate();
  var p;
  if(!join)p=sb.auth.signInWithPassword({email:email,password:pw}).then(authUser);
  else p=signInOrUp(email,pw).then(function(user){
    return sbq(sb.rpc('claim_staff',{p_join_code:code,p_claim_code:claim})).then(function(){return user});
  });
  p.then(function(user){S.busy=false;return cloudEnter(user.id)}).catch(function(e){S.busy=false;S.stage='login';S.loginErr=cerr(e);renderGate()});
}
function cloudRegister(){
  readReg();var r=S.reg,errs=[];
  if(!r.name.trim())errs.push('Enter your school name.');
  if(!/^\S+@\S+\.\S+$/.test((r.email||'').trim()))errs.push('Enter a valid email for the administrator.');
  if((r.pw||'').length<8)errs.push('Choose a password of at least 8 characters.');
  if(!r.confirm)errs.push('Confirm that you are authorised to register this school.');
  if(errs.length){S.regErr=errs.join(' ');renderGate();return}
  S.busy=true;S.regErr='';renderGate();
  var nm=r.name.trim();
  signInOrUp(r.email.trim().toLowerCase(),r.pw).then(function(user){
    return sbq(CL.sb.rpc('register_school',{p_name:nm,p_color:r.color,p_admin_name:r.adminName.trim()||'School administrator',p_city:r.city.trim(),p_motto:r.motto.trim()})).then(function(sc){
      if(Array.isArray(sc))sc=sc[0];
      if(sc&&r.logo&&r.logo.length<=300000)return sbq(CL.sb.from('schools').update({logo_url:r.logo}).eq('id',sc.id));
    }).then(function(){return user});
  }).then(function(user){
    S.busy=false;S.reg=null;S.regErr='';
    return cloudEnter(user.id).then(function(){toast(nm+' is registered. Add classes, then invite teachers and students.')});
  }).catch(function(e){S.busy=false;S.regErr=cerr(e);renderGate()});
}

function persistChatSeen(){if(CL.on&&S.role==='student'&&S.studentId)lsSet('su_cs_'+S.studentId,String(DB.chatSeen[S.studentId]||now()))}
function shrinkImage(file,max,cb){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var w=img.naturalWidth||max,h=img.naturalHeight||max,k=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    try{c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(url);cb(b||file)},'image/jpeg',.8)}catch(e){URL.revokeObjectURL(url);cb(file)}
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(file)};
  img.src=url;
}
function cloudSavePost(t,d,classes,dead,file){

    upl=sb.storage.from(BUCKET).upload(path,file.raw,{contentType:file.raw.type||'application/octet-stream',upsert:true}).then(function(r){
      if(r.error)throw r.error;return {name:file.name,kind:file.kind,size:file.size,path:path};
    });
  }
  upl.then(function(fm){
    var meta=fm?{name:fm.name,kind:fm.kind,size:fm.size,path:fm.path}:null;
    var row={type:d.type,title:d.title.trim(),body:d.body.trim(),subject_id:d.subject||null,deadline:d.type==='assignment'?new Date(dead).toISOString():null,file:meta};
    var w=editing?sbq(sb.from('posts').update(row).eq('id',id)):sbq(sb.from('posts').insert(Object.assign({id:id,school_id:S.school.id,author_id:t.id},row)));
    return w.then(function(){return editing?sbq(sb.from('post_classes').delete().eq('post_id',id)):null})
      .then(function(){return sbq(sb.from('post_classes').insert(classes.map(function(c){return {post_id:id,class_id:c}})))})
      .then(function(){return meta});
  }).then(function(meta){

    if(old){rec.createdAt=old.createdAt;DB.posts[DB.posts.indexOf(old)]=rec}else DB.posts.unshift(rec);
    toast(editing?'Post updated.':'Published to '+names+'.');

/* ---------- compose ---------- */
function fmtSize(b){return b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1)+' MB'}
function readDraft(){
  var f=$('#composeForm');if(!f||!S.draft)return;
  var g=function(q){return f.querySelector(q)};
  if(g('#f-title'))S.draft.title=g('#f-title').value;
  if(g('#f-body'))S.draft.body=g('#f-body').value;
  if(g('#f-subject'))S.draft.subject=g('#f-subject').value;
  if(g('#f-deadline'))S.draft.deadline=g('#f-deadline').value;
  S.draft.classes=[].slice.call(f.querySelectorAll('input[name=cls]:checked')).map(function(i){return i.value});
}
function submitPost(){
  if(S.role!=='teacher'){toast('Only teachers can post.');return}
  var t=curTeacher(),d=S.draft;if(!t||!d)return;
  var errs=[],needsSubj=d.type==='assignment'||d.type==='material';
  var classes=d.classes.filter(function(c){return t.classes.indexOf(c)>-1});
  if(!d.title.trim())errs.push('Add a title.');
  if(!d.body.trim())errs.push('Write a short message.');
  if(!classes.length)errs.push('Choose at least one class.');
  if(needsSubj&&t.subjects.indexOf(d.subject)<0)errs.push('Choose one of your subjects.');
  var dead=null;
  if(d.type==='assignment'){
    dead=d.deadline?new Date(d.deadline).getTime():NaN;
    if(isNaN(dead))errs.push('Set a deadline.');
    else if(dead<now()&&!S.editId)errs.push('The deadline must be in the future.');
  }
  var file=d.file||d.keepFile||null;
  if(d.type==='material'&&!file)errs.push('Attach a file for learning material.');
  if(errs.length){S.errors=errs;render();var el=$('#composeForm');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'});return}
  var names=classes.map(clsName).join(', ');
  if(CL.on){cloudSavePost(t,d,classes,dead,file);return}
  if(S.editId){
    var p=DB.posts.filter(function(x){return x.id===S.editId})[0];
    if(!p||p.authorId!==t.id){toast('You can only edit your own posts.');return}
    p.type=d.type;p.title=d.title.trim();p.body=d.body.trim();p.subject=d.subject;p.classes=classes;p.deadline=d.type==='assignment'?dead:null;p.file=file;
    toast('Post updated. Demo only, not saved after reload.');
  }else{
    DB.posts.unshift({id:nid('p'),type:d.type,title:d.title.trim(),body:d.body.trim(),subject:d.subject,classes:classes,authorId:t.id,createdAt:now(),deadline:d.type==='assignment'?dead:null,file:file});
    toast('Published to '+names+'. Demo only, other devices will not see it.');
  }
  S.draft=null;S.editId=null;S.errors=[];S.tClass='all';S.tType='all';
  setRoute('posts');
}

/* ---------- admin actions ---------- */
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function confirmDelete(key){
  var parts=key.split(':'),kind=parts[0],id=parts.slice(1).join(':');
  S.confirmDel=null;
  if(kind==='post'){
    var p=DB.posts.filter(function(x){return x.id===id})[0];
    if(S.role!=='teacher'||!p||p.authorId!==S.teacherId){toast('You can only delete your own posts.');render();return}
    DB.posts=DB.posts.filter(function(x){return x.id!==id});toast('Post deleted.');
    if(CL.on){cw(CL.sb.from('posts').delete().eq('id',id),'Could not delete');if(p.file&&p.file.path)CL.sb.storage.from(BUCKET).remove([p.file.path]).then(function(){},function(){})}
  }else{
    if(S.role!=='admin'){toast('Only administrators can do that.');render();return}
    if(kind==='cls'){
      var n=DB.students.filter(function(s){return s.classId===id}).length;
      if(n){toast('Move or remove the '+plural(n,'student')+' in '+clsName(id)+' first.');render();return}
      DB.classes=DB.classes.filter(function(c){return c.id!==id});
      DB.teachers.forEach(function(t){var had=t.classes.indexOf(id)>-1;t.classes=t.classes.filter(function(c){return c!==id});if(CL.on&&had)cloudTeacherArrays(t)});
      DB.posts.forEach(function(p){p.classes=p.classes.filter(function(c){return c!==id})});
      var gone=DB.posts.filter(function(p){return !p.classes.length}).map(function(p){return p.id});
      if(CL.on){cw(CL.sb.from('classes').delete().eq('id',id),'Could not remove class');if(gone.length)cw(CL.sb.from('posts').delete().in('id',gone),'Could not remove posts')}
      DB.posts=DB.posts.filter(function(p){return p.classes.length});
      if(S.ttClass===id)S.ttClass=null;
      toast('Class removed.');
    }else if(kind==='sub'){
      var used=DB.posts.some(function(p){return p.subject===id})||DB.teachers.some(function(t){return t.subjects.indexOf(id)>-1});
      if(used){toast('This subject is still used by teachers or posts.');render();return}
      DB.subjects=DB.subjects.filter(function(s){return s.id!==id});if(CL.on)cw(CL.sb.from('subjects').delete().eq('id',id),'Could not remove subject');toast('Subject removed.');
    }else if(kind==='tea'){
      var t=tch(id),c=DB.posts.filter(function(p){return p.authorId===id}).length;
      if(CL.on&&t)cloudRemovePerson(id,!!t.pending);
      DB.teachers=DB.teachers.filter(function(x){return x.id!==id});
      DB.posts=DB.posts.filter(function(p){return p.authorId!==id});
      toast((t?t.name:'Teacher')+' removed'+(c?' with '+plural(c,'post'):'')+'.');
    }else if(kind==='stu'){
      var s0=stu(id);if(CL.on&&s0)cloudRemovePerson(id,!!s0.pending);
      DB.students=DB.students.filter(function(s){return s.id!==id});delete DB.done[id];delete DB.seen[id];toast('Student removed.');
    }
  }
  render();
}
function checked(f,name){return [].slice.call(f.querySelectorAll('input[name='+name+']:checked')).map(function(i){return i.value})}
function handleSubmit(f){
  var id=f.id;
  if(id==='loginForm'){if(CL.on)cloudLogin();else doLogin(f);return}
  if(id==='chatForm'){sendChat(f);return}
  if(id==='regForm'){doRegister(f);return}
  if(id==='brandForm'){saveBrand(f);return}
  if(id==='composeForm'){readDraft();submitPost();return}
  if(S.role!=='admin'){toast('Only administrators can do that.');return}
  var fd=new FormData(f),name=String(fd.get('name')||'').trim();
  if(id==='adm-class'){
    if(!name){toast('Enter a class name.');return}
    var cid=CL.on?uuid():name.replace(/\s+/g,'').toUpperCase();
    if(CL.on?DB.classes.some(function(c){return c.name.toLowerCase()===name.toLowerCase()}):cls(cid)){toast(name+' already exists.');return}
    var lvl=fd.get('level')==='Senior'?'Senior':'Junior';
    DB.classes.push({id:cid,name:name,level:lvl});DB.chat[cid]=DB.chat[cid]||[];
    if(CL.on)cw(CL.sb.from('classes').insert({id:cid,school_id:S.school.id,name:name,level:lvl}),'Could not add class');
    toast(name+' added.');
  }else if(id==='adm-subject'){
    if(!name){toast('Enter a subject name.');return}
    var sid=CL.on?uuid():(slug(name)||nid('sub'));
    if(CL.on?DB.subjects.some(function(s){return s.name.toLowerCase()===name.toLowerCase()}):subj(sid)){toast(name+' already exists.');return}
    var hue=Math.floor(Math.random()*360);DB.subjects.push({id:sid,name:name,h:hue});
    if(CL.on)cw(CL.sb.from('subjects').insert({id:sid,school_id:S.school.id,name:name,hue:hue}),'Could not add subject');
    toast(name+' added.');
  }else if(id==='adm-teacher'){
    if(!name){toast('Enter the teacher\'s name.');return}
    var ts=checked(f,'tsub'),tc=checked(f,'tcls');
    if(!ts.length||!tc.length){toast('Choose at least one subject and one class.');return}
    if(CL.on){cloudAddPerson({id:uuid(),school_id:S.school.id,role:'teacher',full_name:name,subject_ids:ts,class_ids:tc},function(x){DB.teachers.push({id:x.id,name:name,subjects:ts,classes:tc,pending:true,code:x.claim_code});toast(name+' added. Claim code: '+x.claim_code);render()});return}
    DB.teachers.push({id:nid('t'),name:name,subjects:ts,classes:tc});toast(name+' added.');
  }else if(id==='adm-student'){
    if(!name){toast('Enter the student\'s name.');return}
    if(CL.on){var cid2=String(fd.get('classId')||''),sno=String(fd.get('sno')||'').replace(/[^A-Za-z0-9]/g,'')||nextStudentNo();
      if(!cls(cid2)){toast('Add a class first.');return}
      if(DB.students.some(function(s){return s.no===sno})){toast('That student number is already used.');return}
      cloudAddPerson({id:uuid(),school_id:S.school.id,role:'student',full_name:name,student_no:sno,class_id:cid2},function(x){DB.students.push({id:x.id,name:name,classId:cid2,status:'active',no:sno,pending:true,code:x.claim_code});toast(name+' added. Student ID: '+stuId({no:sno,code:x.claim_code}));render()});return}
    DB.students.push({id:nid('s'),name:name,classId:String(fd.get('classId')),status:'active'});toast(name+' added.');
  }
  render();
}

function processLogo(file,cb){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('Please choose an image file.');return}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var w=img.naturalWidth||256,h=img.naturalHeight||256,k=Math.min(1,256/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    try{c.getContext('2d').drawImage(img,0,0,c.width,c.height);var d=c.toDataURL('image/png');URL.revokeObjectURL(url);cb(d)}catch(e){cb(url)}
  };
  img.onerror=function(){toast('Could not read that image. Try a PNG or JPG.')};
  img.src=url;
}

    h+='<div class="mrow '+(mine?'me':'them')+(end?' tail':'')+'">'+(mine?'':(end?avHtml(m.from):'<i class="mav ghost"></i>'))+'<div class="mcol">';
    if(!mine&&start)h+='<div class="mname">'+esc(snd.name)+(snd.role==='teacher'?'<span class="tbadge">Teacher</span>':'')+'</div>';
    if(m.removed)h+='<div class="bubble removed">'+(m.by==='teacher'?'Removed by a teacher':'Message deleted')+'</div>';
    else h+='<button type="button" class="bubble'+(m.img?' img':'')+'" data-act="tapmsg" data-id="'+esc(m.id)+'" aria-label="Message from '+esc(snd.name)+'. Tap for options">'+(m.img?'<img class="mimg" src="'+esc(m.img)+'" alt="Photo from '+esc(snd.name)+'">':'')+(m.text?esc(m.text):'')+'</button>';
    var rk=Object.keys(m.react||{});
    if(rk.length&&!m.removed)h+='<div class="rx">'+rk.map(function(k){var a=m.react[k];return '<span class="'+(me&&a.indexOf(me)>-1?'mine':'')+'">'+k+(a.length>1?' '+a.length:'')+'</span>'}).join('')+'</div>';
    if(S.chatReact===m.id&&!m.removed){
      var canRm=mine||S.role==='teacher'||S.role==='admin';
      h+='<div class="tapmenu" role="group" aria-label="Message options">'+(me?REACTS.map(function(r){return '<button type="button" data-act="react" data-id="'+esc(m.id)+'" data-v="'+r+'" aria-label="React '+r+'">'+r+'</button>'}).join(''):'')+(canRm?'<button type="button" class="rm" data-act="rmmsg" data-id="'+esc(m.id)+'">'+(mine?'Delete':'Remove')+'</button>':'')+'</div>';
    }
    if(i===lastMine)h+='<div class="delivered">'+(CL.on?'Sending…':'Demo only, not delivered')+'</div>';
    h+='</div></div>';
  });
  return h;
}
function buildThread(){
  var host=$('#thread');
  if(!S.thread){host.innerHTML='';document.body.style.overflow='';return}
  var cid=S.thread,c=cls(cid);
  if(!c){S.thread=null;host.innerHTML='';document.body.style.overflow='';return}
  var members=DB.students.filter(function(s){return s.classId===cid&&s.status==='active'});
  document.body.style.overflow='hidden';
  host.innerHTML='<div class="thread-bg"><section class="thread" role="dialog" aria-modal="true" aria-label="'+esc(c.name)+' class chat">'+
    '<header class="th-head"><button class="th-back" data-act="thback" aria-label="Back to chats">'+icon('left')+'<span>Chats</span></button>'+
    '<div class="th-title"><div class="av-stack">'+members.slice(0,3).map(function(s){return avHtml(s.id)}).join('')+'</div><b>'+esc(c.name)+'</b><small>'+plural(members.length,'student')+'</small></div>'+
    '<button class="th-info" data-act="chatrules" aria-label="Chat rules">'+icon('info')+'</button></header>'+
    '<div class="th-banner">'+icon('eye')+'<span>Teachers can read this chat. Keep it kind and about school.</span></div>'+
    '<div class="th-rules" id="th-rules"></div><div id="th-staff"></div><div class="msgs" id="msgs" role="log" aria-live="polite"></div><div id="th-comp"></div></section></div>';
  fillThread(true);syncVV();
}
function fillThread(toBottom){
  var msgs=$('#msgs');if(!S.thread||!msgs)return;
  var cid=S.thread,near=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<90,top=msgs.scrollTop;
  msgs.innerHTML=msgsHtml(cid);
  msgs.scrollTop=(toBottom||near)?msgs.scrollHeight:top;
  var paused=!!DB.chatPaused[cid];
  $('#th-staff').innerHTML=S.role==='student'?'':'<div class="staffbar"><span>'+(paused?'Chat is paused for this class':'Chat is open')+'</span><button class="btn sm ghost" data-act="chatpause">'+(paused?'Resume chat':'Pause chat')+'</button></div>';
  $('#th-rules').innerHTML=S.chatRules?rulesCard(false):'';
  var lock=S.role==='student'&&paused,key=S.role+(lock?'p':'o'),comp=$('#th-comp');
  if(comp.getAttribute('data-key')!==key){
    comp.setAttribute('data-key',key);
    if(S.role==='admin')comp.innerHTML='<div class="cbar">You are viewing as administrator. You can pause chat and remove messages.</div>';
    else if(lock)comp.innerHTML='<div class="cbar">Chat is paused by your teacher. It will open again after the lesson.</div>';
    else comp.innerHTML='<form class="composer" id="chatForm" novalidate><label class="plus" for="chat-file" aria-label="Share a photo">'+icon('plus')+'</label><input type="file" id="chat-file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"><div class="cwrap"><input type="text" id="chat-input" placeholder="Message" autocomplete="off" maxlength="500" enterkeyhint="send" value="'+esc(S.chatDraft||'')+'"><button class="send'+(S.chatDraft?' on':'')+'" type="submit" aria-label="Send">'+icon('up')+'</button></div></form>';
  }
}
function openThread(cid){
  if(!canChat(cid)){toast('You can only open your own class chat.');return}
  DB.chat[cid]=DB.chat[cid]||[];
  S.thread=cid;S.chatReact=null;S.chatRules=false;S.chatDraft='';markSeen();buildThread();
}
function closeThread(){S.thread=null;S.chatReact=null;S.chatRules=false;markSeen();buildThread();render()}
function findMsg(id){var l=DB.chat[S.thread]||[];for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function reactMsg(id,emoji){
  var m=findMsg(id),me=chatMe();
  if(!m||!me||m.removed||REACTS.indexOf(emoji)<0)return;
  m.react=m.react||{};var a=m.react[emoji]||[],i=a.indexOf(me);
  var added=i<=-1;if(i>-1)a.splice(i,1);else a.push(me);
  if(CL.on){if(added)cw(CL.sb.from('message_reactions').insert({message_id:m.id,user_id:me,emoji:emoji}),'Reaction not saved');else cw(CL.sb.from('message_reactions').delete().match({message_id:m.id,user_id:me,emoji:emoji}),'Reaction not saved')}
  if(a.length)m.react[emoji]=a;else delete m.react[emoji];
  S.chatReact=null;fillThread(false);
}
function removeMsg(id){
  var m=findMsg(id);if(!m||m.removed)return;
  var mine=m.from===chatMe();
  if(!mine&&S.role!=='teacher'&&S.role!=='admin'){toast('You can only delete your own messages.');return}
  if(CL.on)cw(CL.sb.rpc('remove_message',{p_message:m.id}),'Could not remove');
  m.removed=true;m.by=mine?'author':'teacher';m.text='';m.img=null;m.react=null;
  S.chatReact=null;fillThread(false);toast(mine?'Message deleted.':'Message removed.');
}
function togglePause(){
  if(S.role==='student')return;
  var cid=S.thread;if(!cid||!canChat(cid))return;
  var p=!DB.chatPaused[cid];DB.chatPaused[cid]=p;
  if(CL.on)cw(CL.sb.rpc('set_chat_pause',{p_class:cid,p_paused:p}),'Could not change chat');
  var who=S.role==='admin'?'the school office':(curTeacher()||{name:'a teacher'}).name;
  if(!CL.on)DB.chat[cid].push({id:nid('m'),from:'system',text:(p?'Chat paused by ':'Chat resumed by ')+who,at:now()});
  fillThread(true);
}
function sendChat(f){
  var inp=f.querySelector('#chat-input'),text=(inp.value||'').trim(),cid=S.thread,me=chatMe();
  if(!cid||!me||!text||!canChat(cid))return;
  if(S.role==='student'&&DB.chatPaused[cid]){toast('Chat is paused by your teacher.');return}
  if(BADWORDS.test(text)){toast('Keep it kind. That message was not sent.');return}
  var nm={id:nid('m'),from:me,text:text.slice(0,500),at:now(),local:true};DB.chat[cid].push(nm);if(CL.on)cloudSendText(cid,nm);
  inp.value='';S.chatDraft='';f.querySelector('.send').classList.remove('on');
  markSeen();S.chatReact=null;fillThread(true);inp.focus();
}

/* ---------- draggable glass tab bar ---------- */
var DRAG=null,justDragged=false,SETTLE=null;
function navIndex(){var c=0;NAV[S.role].forEach(function(n,i){if(n[0]===S.route)c=i});return c}
function lensRect(d,x){
  var w=d.iw*1.45,h=d.h+30,cx=Math.min(Math.max(x,d.left+d.iw/2),d.left+d.w-d.iw/2);
  return {x:cx-w/2,y:d.top-15,w:w,h:h,cx:cx};
}
function setLens(l,r){l.style.width=r.w+'px';l.style.height=r.h+'px';l.style.transform='translate('+r.x+'px,'+r.y+'px)'}
function cleanSettle(){if(SETTLE){clearTimeout(SETTLE.t);SETTLE.lens.remove();SETTLE.el.classList.remove('drag');SETTLE=null}}
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest&&e.target.closest('.dock-in');
  if(!el||(e.pointerType==='mouse'&&e.button!==0))return;
  cleanSettle();
  var r=el.getBoundingClientRect(),n=NAV[S.role].length;
  DRAG={el:el,left:r.left,top:r.top,w:r.width,h:r.height,n:n,iw:r.width/n,x0:e.clientX,moved:false,id:e.pointerId,idx:navIndex(),lens:null,t0:0};
});
document.addEventListener('pointermove',function(e){
  var d=DRAG;if(!d||e.pointerId!==d.id)return;
  if(!d.moved){
    if(Math.abs(e.clientX-d.x0)<8)return;
    d.moved=true;d.el.classList.add('drag');
    try{d.el.setPointerCapture(e.pointerId)}catch(_){}
    var l=document.createElement('div');l.className='lens';document.body.appendChild(l);d.lens=l;
    setLens(l,{x:d.left+d.idx*d.iw,y:d.top,w:d.iw,h:d.h});
    void l.offsetWidth;
    l.classList.add('anim');
    d.t0=setTimeout(function(){l.classList.remove('anim')},260);
  }
  var r=lensRect(d,e.clientX);
  setLens(d.lens,r);
  var idx=Math.min(d.n-1,Math.max(0,Math.floor((r.cx-d.left)/d.iw)));
  if(idx!==d.idx){
    d.idx=idx;
    [].forEach.call(d.el.querySelectorAll('button'),function(b,i){b.classList.toggle('on',i===idx)});
    try{if(navigator.vibrate)navigator.vibrate(8)}catch(_){}
  }
});
function endDrag(e,cancel){
  var d=DRAG;if(!d||(e&&e.pointerId!==d.id))return;
  DRAG=null;
  if(!d.moved)return;
  clearTimeout(d.t0);
  justDragged=true;setTimeout(function(){justDragged=false},400);
  var nav=NAV[S.role],idx=cancel?navIndex():d.idx,l=d.lens;
  l.classList.add('anim');
  setLens(l,{x:d.left+idx*d.iw,y:d.top,w:d.iw,h:d.h});
  if(nav[idx][0]!==S.route)setRoute(nav[idx][0]);else renderChrome(nav);
  SETTLE={el:d.el,lens:l,t:setTimeout(function(){
    d.el.classList.remove('drag');l.style.opacity='0';
    setTimeout(function(){l.remove()},220);SETTLE=null;
  },340)};
}
document.addEventListener('pointerup',function(e){endDrag(e,false)});
document.addEventListener('pointercancel',function(e){endDrag(e,true)});

document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(S.modal){S.modal=null;renderModal()}else if(S.thread)closeThread()});
setInterval(function(){var a=document.activeElement;if(S.stage!=='app'||S.thread||S.route==='compose'||S.modal||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))return;render()},60000);

cloudInit();
S.stage='splash';render();
setInterval(function(){if(CL.on)cloudRefresh()},45000);
setTimeout(function(){if(CL.on){cloudBoot();return}S.stage=tourSeen()?'login':'tutorial';S.tourStep=0;render()},2300);
})();
</script>
